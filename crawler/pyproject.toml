[project]
name = "beecrawl"
version = "0.1.0"
description = "Crawler and question-bank builder for the History Bee/Bowl trainer"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "selectolax>=0.3.21",
    "pdfplumber>=0.11",
    "python-docx>=1.1",
    "typer>=0.12",
    "rich>=13.7",
    "anthropic>=0.69",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
beecrawl = "beecrawl.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["beecrawl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
